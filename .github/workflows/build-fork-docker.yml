name: Build Fork Docker Image

on:
  push:
    branches:
      - my-fork
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/katze-942/backend
  FRONTEND_REPOSITORY: Katze-942/frontend
  FRONTEND_RELEASE_TAG: dev-build

jobs:
  build-docker-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare build metadata
        id: meta
        env:
          BACKEND_COMMIT: ${{ github.sha }}
        run: |
          FRONTEND_URL="https://github.com/${FRONTEND_REPOSITORY}/releases/download/${FRONTEND_RELEASE_TAG}/remnawave-frontend.zip"
          FRONTEND_COMMIT="$(curl -fsSL "https://api.github.com/repos/${FRONTEND_REPOSITORY}/releases/tags/${FRONTEND_RELEASE_TAG}" | jq -r '.target_commitish')"
          if [ -z "$FRONTEND_COMMIT" ] || [ "$FRONTEND_COMMIT" = "null" ]; then
            echo "Cannot resolve frontend release ${FRONTEND_REPOSITORY}@${FRONTEND_RELEASE_TAG}" >&2
            exit 1
          fi

          echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "short_sha=${BACKEND_COMMIT:0:12}" >> "$GITHUB_OUTPUT"
          echo "frontend_url=$FRONTEND_URL" >> "$GITHUB_OUTPUT"
          echo "frontend_commit=$FRONTEND_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Check frontend release asset
        run: curl -fIsSL "${{ steps.meta.outputs.frontend_url }}" >/dev/null

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:my-fork
            ${{ env.IMAGE_NAME }}:sha-${{ steps.meta.outputs.short_sha }}
          build-args: |
            FRONTEND_URL=${{ steps.meta.outputs.frontend_url }}
            BRANCH=my-fork
            __RW_METADATA_VERSION=${{ steps.meta.outputs.version }}
            __RW_METADATA_GIT_BRANCH=${{ github.ref_name }}
            __RW_METADATA_BUILD_TIME=${{ steps.meta.outputs.build_time }}
            __RW_METADATA_BUILD_NUMBER=${{ github.run_number }}
            __RW_METADATA_GIT_BACKEND_COMMIT=${{ github.sha }}
            __RW_METADATA_GIT_FRONTEND_COMMIT=${{ steps.meta.outputs.frontend_commit }}
